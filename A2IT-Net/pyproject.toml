[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2it-net"
version = "1.0.0"
description = "Attribute-Aware Image-Tabular Network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "Pillow>=10.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.setuptools.packages.find]
include = ["a2it_net*"]
